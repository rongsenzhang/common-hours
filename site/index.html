<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#163e32" />
    <meta
      name="description"
      content="Explore fictional volunteering roles in Greater Manchester, ask questions, and find activities that fit your interests and availability."
    />
    <title>Discover volunteer roles · Common Hours</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/dm-sans.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="frame top-inner">
        <a class="brand" href="#discover" aria-label="Common Hours home"
          ><span id="mark"></span>Common Hours</a
        >
        <nav aria-label="Main navigation">
          <a href="#discover" data-page="discover">Discover</a>
          <a href="#ask" data-page="ask">Ask the role finder</a>
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1" class="frame">
      <p class="loading">Opening the volunteer catalogue…</p>
    </main>
    <footer>
      <div class="frame footer-inner">
        <div>
          <strong>Common Hours</strong>
          <p>Independent research demo · Fictional roles and organisations</p>
        </div>
        <span>Common Hours 1.2</span>
      </div>
    </footer>
    <dialog id="role-dialog" aria-labelledby="dialog-title"></dialog>
    <div id="announcer" class="sr" role="status" aria-live="polite"></div>
    <noscript
      ><p>
        Turn on JavaScript to search the volunteering catalogue or ask about a
        role.
      </p></noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
